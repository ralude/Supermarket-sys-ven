packages:
  - apps/*
  - packages/*
  - packages/drivers/*

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  # Excepcion exacta revisada para adoptar la rama Electron soportada del corte.
  - electron@44.1.0
